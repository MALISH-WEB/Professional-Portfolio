<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Malish— Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">MALISH</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav4">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav4">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <section class="container">
      <h2 class="text-center fw-bold mb-4">Contact Me</h2>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <form action="mailto:youremail@example.com" method="post" enctype="text/plain" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name *</label>
              <input id="name" name="name" class="form-control" type="text" required>
              <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email *</label>
              <input id="email" name="email" class="form-control" type="email" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Message *</label>
              <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
              <div class="invalid-feedback">Please type a message.</div>
            </div>

            <button class="btn btn-primary" type="submit">Send Message</button>
            <button class="btn btn-outline-secondary ms-2" type="reset">Reset</button>
          </form>

          <hr class="my-4">

          <div class="d-flex gap-3">
            <a href="https://github.com/MALISH-WEB/MALISH-WEB" class="btn btn-outline-dark">GitHub</a>
            <a href="https://www.linkedin.com/in/malish-emmanuel-abui-265257359?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" class="btn btn-outline-primary">LinkedIn</a>
            <a href="#" class="btn btn-outline-info">Twitter</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-light py-3 text-center">&copy; 2025 Malish</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Simple client-side validation -->
  <script>
    (function () {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();
  </script>
</body>
</html>
